---
- hosts: masters
  become: yes
  tasks:
    - name: Check if cluster is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_init_stat

    - name: Initialize Kubernetes cluster
      command: >
        kubeadm init
        --apiserver-advertise-address={{ node_ip }}
        --pod-network-cidr={{ pod_network_cidr }}
        --service-cidr={{ service_subnet }}
        --node-name={{ inventory_hostname }}
      register: kubeadm_init
      when: not k8s_init_stat.stat.exists

    - name: Create .kube directory for Ansible user
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy admin.conf to Ansible user
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
        remote_src: yes

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory

    - name: Copy admin.conf to root
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        mode: '0644'
        remote_src: yes

    - name: Get join command
      shell: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Set join command fact
      set_fact:
        join_command: "{{ join_command_raw.stdout_lines[0] }}"

    - name: Save join command to file
      copy:
        content: |
          #!/bin/bash
          {{ join_command }}
        dest: /tmp/kubeadm_join_cmd.sh
        mode: '0755'

    - name: Fetch join command to local
      fetch:
        src: /tmp/kubeadm_join_cmd.sh
        dest: ./kubeadm_join_cmd.sh
        flat: yes

