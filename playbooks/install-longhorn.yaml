---
- name: Install Longhorn
  hosts: masters
  become: yes

  vars:
    longhorn_user: "admin"
    auth_file_path: "/tmp/auth"

  tasks:
    - name: Check is password setted
      assert:
        that:
          - longhorn_password is defined
        fail_msg: "You must pass 'longhorn_password'"

    - name: Install Longhorn
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn
        chart_repo_url: https://charts.longhorn.io
        chart_version: "1.11.0"
        release_namespace: longhorn-system
        create_namespace: true
        state: present
        wait: true

    - name: Look up the existing basic-auth secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: basic-auth
        namespace: longhorn-system
      register: longhorn_basic_auth

    # openssl salts randomly, so regenerating the hash rewrites the secret on
    # every run. Only create it when it is missing.
    - name: Create the basic-auth secret
      when: longhorn_basic_auth.resources | length == 0
      block:
        - name: Create auth file for basic auth
          shell: |
            echo "{{ longhorn_user }}:$(openssl passwd -apr1 -stdin <<< '{{ longhorn_password }}')" > {{ auth_file_path }}
          args:
            executable: /bin/bash
          no_log: true

        - name: Read temporary auth file on remote host
          slurp:
            src: "{{ auth_file_path }}"
          register: auth_file_content

        - name: Create Kubernetes basic-auth secret for Traefik
          kubernetes.core.k8s:
            state: present
            namespace: longhorn-system
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: basic-auth
              type: Opaque
              data:
                users: "{{ auth_file_content.content }}"

      always:
        - name: Remove temporary auth file
          file:
            path: "{{ auth_file_path }}"
            state: absent

    - name: Create BasicAuth Middleware for Longhorn
      tags: frontend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: longhorn-basicauth
            namespace: longhorn-system
          spec:
            basicAuth:
              secret: basic-auth
              realm: "Authentication Required"

    - name: Deploy Longhorn IngressRoute Frontend
      tags: frontend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: longhorn-ingress
            namespace: longhorn-system
          spec:
            entryPoints:
              - web
            routes:
              - match: "Host(`longhorn.{{ web_entrypoint_ip }}.nip.io`)"
                kind: Rule
                middlewares:
                  - name: longhorn-basicauth
                    namespace: longhorn-system
                services:
                  - name: longhorn-frontend
                    port: 80

    # Counterpart to the webhook relaxation in join-workers.yml: once the
    # admission webhook has endpoints again, put failurePolicy back to Fail.
    - name: Restore the Longhorn validating webhook
      when: longhorn_webhook_blocking | default(false) | bool
      block:
        - name: Wait for the Longhorn admission webhook to have endpoints
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Endpoints
            namespace: longhorn-system
            name: longhorn-admission-webhook
          register: longhorn_webhook_endpoints
          until: >-
            longhorn_webhook_endpoints.resources | default([]) | length > 0 and
            longhorn_webhook_endpoints.resources[0].subsets | default([]) | length > 0
          retries: 30
          delay: 10

        - name: Set the Longhorn validating webhook back to failurePolicy Fail
          kubernetes.core.k8s:
            state: patched
            api_version: admissionregistration.k8s.io/v1
            kind: ValidatingWebhookConfiguration
            name: longhorn-webhook-validator
            merge_type: strategic-merge
            definition:
              webhooks:
                - name: validator.longhorn.io
                  failurePolicy: Fail
