---
- hosts: k8s_cluster
  become: yes
  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        state: present
        upgrade: dist
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - python3-pip          # <- ensure pip is installed
          - nfs-common
          - open-iscsi           # <- Longhorn prerequisite
        state: present

    - name: Enable iscsid for Longhorn
      systemd:
        name: iscsid
        state: started
        enabled: yes

    - name: Disable swap
      command: swapoff -a
      when: ansible_facts['swaptotal_mb'] > 0
      changed_when: true

    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '\s+swap\s+'
        state: absent

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Make kernel modules persistent
      copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/k8s.conf

    - name: Set sysctl parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }

    - name: Add hosts entries
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item]['node_ip'] }} {{ item }}"
        state: present
      loop: "{{ groups['k8s_cluster'] }}"

    - name: Get PyYAML version seen by the Ansible interpreter
      command: "{{ ansible_facts['python']['executable'] }} -c 'import yaml; print(yaml.__version__)'"
      register: pyyaml_version
      changed_when: false
      failed_when: false

    # Ubuntu ships PyYAML as a dpkg without a RECORD file, so pip refuses to
    # upgrade it ("Cannot uninstall PyYAML 6.0.1, RECORD file not found"), which
    # breaks any install pulling pyyaml>=6.0.3 (current kubernetes client).
    # --ignore-installed drops a newer copy in /usr/local/lib/python3/dist-packages,
    # which precedes the distro path, and leaves the dpkg untouched.
    - name: Install a pip-managed PyYAML next to the distro one
      ansible.builtin.pip:
        name: "PyYAML>=6.0.3"
        extra_args: --break-system-packages --ignore-installed
      when: >-
        pyyaml_version.rc != 0 or
        pyyaml_version.stdout is version('6.0.3', '<')

    - name: Install Python libraries globally
      ansible.builtin.pip:
        name:
          - kubernetes
          - openshift
        extra_args: --break-system-packages

    - name: Reboot if needed
      reboot:
        msg: "Reboot initiated by Ansible for kernel parameter changes"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: ansible_facts['kernel'] is version('5.4', '<')

