---
- hosts: masters
  become: yes

  tasks:
    - name: Install MetalLB
      kubernetes.core.helm:
        name: metallb
        chart_ref: metallb
        chart_repo_url: https://metallb.github.io/metallb
        release_namespace: metallb-system
        create_namespace: true
        wait: true
        values: {}

    - name: Wait for MetalLB webhook to be ready
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: metallb-system
        name: metallb-controller
      register: metallb_controller
      until:
        - metallb_controller.resources | length > 0
        - metallb_controller.resources[0].status.availableReplicas | default(0) > 0
      retries: 30
      delay: 10

    - name: Create MetalLB IP Address pool
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default-pool
            namespace: metallb-system
          spec:
            addresses:
              - "{{ metallb_ip_range }}"

    - name: Create MetalLB L2 Advertisement
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: l2
            namespace: metallb-system
          spec:
            ipAddressPools:
            - default-pool
