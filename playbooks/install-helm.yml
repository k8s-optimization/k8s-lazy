---
- hosts: masters
  become: yes
  tasks:
    - name: Check if helm is installed
      command: which helm
      register: helm_installed
      changed_when: false
      failed_when: false

    - name: Download helm installation script
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o /tmp/install_helm.sh
      args:
        creates: /tmp/install_helm.sh
      when: helm_installed.rc != 0

    - name: Make helm script executable
      file:
        path: /tmp/install_helm.sh
        mode: '0700'
      when: helm_installed.rc != 0

    - name: Install helm
      environment:
        DESIRED_VERSION: v3.19.0
      command: /tmp/install_helm.sh
      when: helm_installed.rc != 0

    # Without helm-diff the kubernetes.core.helm module falls back to a coarse
    # check that both misses and invents changes ("The default idempotency check
    # can fail to report changes in certain cases").
    - name: Install helm-diff plugin for reliable idempotency checks
      kubernetes.core.helm_plugin:
        plugin_path: https://github.com/databus23/helm-diff
        plugin_version: "3.15.13"
        state: present