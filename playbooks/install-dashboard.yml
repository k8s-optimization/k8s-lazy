---
- hosts: masters
  become: yes
  tasks:
    - name: Download Kubernetes Dashboard manifest
      get_url:
        url: https://raw.githubusercontent.com/kubernetes/dashboard/v2.7.0/aio/deploy/recommended.yaml
        dest: /tmp/kubernetes-dashboard.yaml
        mode: '0644'

    - name: Apply Kubernetes Dashboard manifest
      kubernetes.core.k8s:
        state: present
        src: /tmp/kubernetes-dashboard.yaml

    - name: Wait for dashboard pods to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: kubernetes-dashboard
        label_selectors:
          - k8s-app=kubernetes-dashboard
      register: dashboard_pods
      until: dashboard_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
      retries: 30
      delay: 10

    - name: Get dashboard services
      kubernetes.core.k8s_info:
        kind: Service
        namespace: kubernetes-dashboard
      register: dashboard_services

    - name: Show available services
      debug:
        msg: "Available services: {{ dashboard_services.resources | map(attribute='metadata.name') | list }}"

    - name: Create IP AllowList Middleware for Dashboard
      tags: frontend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: dashboard-ipallowlist
            namespace: kubernetes-dashboard
          spec:
            ipAllowList:
              sourceRange:
                - 10.0.0.0/8
                - 192.168.0.0/16

    - name: Create ServersTransport for HTTPS backend
      tags: frontend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: ServersTransport
          metadata:
            name: dashboard-transport
            namespace: kubernetes-dashboard
          spec:
            insecureSkipVerify: true

    - name: Deploy Kubernetes Dashboard IngressRoute
      tags: frontend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: IngressRoute
          metadata:
            name: dashboard-ingress
            namespace: kubernetes-dashboard
          spec:
            entryPoints:
              - websecure
            routes:
              - match: "Host(`dashboard.{{ web_entrypoint_ip }}.nip.io`)"
                kind: Rule
                middlewares:
                  - name: dashboard-ipallowlist
                    namespace: kubernetes-dashboard
                services:
                  - name: kubernetes-dashboard
                    port: 443
                    scheme: https
                    serversTransport: dashboard-transport
            tls: {}

    - name: Create ServiceAccount for dashboard admin
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: dashboard-admin
            namespace: kubernetes-dashboard

    - name: Create ClusterRoleBinding for dashboard
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "dashboard-admin-binding"
          subjects:
            - kind: ServiceAccount
              name: dashboard-admin
              namespace: kubernetes-dashboard
          roleRef:
            kind: ClusterRole
            name: cluster-admin
            apiGroup: rbac.authorization.k8s.io

    - name: Get dashboard admin token
      command: kubectl -n kubernetes-dashboard create token dashboard-admin
      register: dashboard_token
      changed_when: false

    - name: Show token
      debug:
        msg: "Dashboard token: {{ dashboard_token.stdout }}"
