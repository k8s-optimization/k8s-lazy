---
- hosts: masters
  become: yes
  tasks:
    - name: Install dashboard
      kubernetes.core.helm:
        name: kubernetes-dashboard
        chart_ref: kubernetes-dashboard
        chart_repo_url: https://kubernetes.github.io/dashboard
        release_namespace: kubernetes-dashboard
        create_namespace: true
        state: present
        wait: yes
        timeout: 300s

    - name: Deploy Longhorn Ingress Frontend
      tags: frontend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: dashboard-ingress
            namespace: kubernetes-dashboard
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
              nginx.ingress.kubernetes.io/ssl-redirect: 'false'
              nginx.ingress.kubernetes.io/proxy-body-size: 1000m
          spec:
            ingressClassName: nginx
            rules:
              - host: dashboard.local
                http:
                  paths:
                    - pathType: Prefix
                      path: /
                      backend:
                        service:
                          name: kubernetes-dashboard-kong-proxy
                          port:
                            number: 443

    - name: Create ServiceAccount for dashboard admin
      kubernetes.core.k8s:
        state: present
        namespace: kubernetes-dashboard
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: dashboard-admin

    - name: Create ClusterRoleBinding for dashboard
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "dashboard-admin-binding"
          subjects:
            - kind: ServiceAccount
              name: dashboard-admin
              namespace: kubernetes-dashboard
          roleRef:
            kind: ClusterRole
            name: cluster-admin
            apiGroup: rbac.authorization.k8s.io

    - name: get dashboard admin token
      command: kubectl -n kubernetes-dashboard create token dashboard-admin
      register: dashboard_token

    - name: Show token
      debug:
        msg: "Dashboard token: {{ dashboard_token.stdout }}"
