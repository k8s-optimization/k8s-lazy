---
- hosts: masters
  become: yes
  tasks:
    - name: Download Kubernetes Dashboard manifest
      get_url:
        url: https://raw.githubusercontent.com/kubernetes/dashboard/v2.7.0/aio/deploy/recommended.yaml
        dest: /tmp/kubernetes-dashboard.yaml
        mode: '0644'

    - name: Apply Kubernetes Dashboard manifest
      kubernetes.core.k8s:
        state: present
        src: /tmp/kubernetes-dashboard.yaml

    - name: Wait for dashboard pods to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: kubernetes-dashboard
        label_selectors:
          - k8s-app=kubernetes-dashboard
      register: dashboard_pods
      until: dashboard_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
      retries: 30
      delay: 10

    - name: Get dashboard services
      kubernetes.core.k8s_info:
        kind: Service
        namespace: kubernetes-dashboard
      register: dashboard_services

    - name: Show available services
      debug:
        msg: "Available services: {{ dashboard_services.resources | map(attribute='metadata.name') | list }}"

    - name: Deploy Kubernetes Dashboard Ingress
      tags: frontend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: dashboard-ingress
            namespace: kubernetes-dashboard
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
              nginx.ingress.kubernetes.io/use-regex: "true"
              nginx.ingress.kubernetes.io/proxy-body-size: 1000m
              nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
              nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
              nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
              nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.0.0/16"
          spec:
            ingressClassName: nginx
            rules:
              - host: "dashboard.{{ web_entrypoint_ip }}.nip.io"
                http:
                  paths:
                    - pathType: Prefix
                      path: /
                      backend:
                        service:
                          name: kubernetes-dashboard
                          port:
                            number: 443 

    - name: Create ServiceAccount for dashboard admin
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: dashboard-admin
            namespace: kubernetes-dashboard

    - name: Create ClusterRoleBinding for dashboard
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: "dashboard-admin-binding"
          subjects:
            - kind: ServiceAccount
              name: dashboard-admin
              namespace: kubernetes-dashboard
          roleRef:
            kind: ClusterRole
            name: cluster-admin
            apiGroup: rbac.authorization.k8s.io

    - name: get dashboard admin token
      command: kubectl -n kubernetes-dashboard create token dashboard-admin
      register: dashboard_token

    - name: Show token
      debug:
        msg: "Dashboard token: {{ dashboard_token.stdout }}"
