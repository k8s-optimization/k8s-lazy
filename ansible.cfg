[defaults]
inventory = inventory.ini
host_key_checking = False
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks
forks = 3
gather_facts = True
timeout = 30

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
